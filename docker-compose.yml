services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nexus-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - PYTHONUNBUFFERED=1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - HF_TOKEN=${HF_TOKEN:-}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-nexus}
      - INGEST_MAX_FILES=${INGEST_MAX_FILES:-2}
      - INGEST_VISION_WORKERS=${INGEST_VISION_WORKERS:-8}
      - PDF_RENDER_LONG_EDGE=${PDF_RENDER_LONG_EDGE:-1456}
      # Local default is 3000, can be overridden in prod via .env
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ./var:/app/var
      # - /tmp:/tmp
    depends_on:
      - qdrant

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Interpolate from your .env file, fallback to localhost
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api}
    container_name: nexus-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  qdrant_storage:
