services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nexus-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-backend
    ports:
      - "8000:8000"
    environment:
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - PYTHONUNBUFFERED=1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - HF_TOKEN=${HF_TOKEN:-}
      - INGEST_PARSE_WORKERS=${INGEST_PARSE_WORKERS:-2}
      - INGEST_VISION_WORKERS=${INGEST_VISION_WORKERS:-3}
      - PDF_RENDER_DPI=${PDF_RENDER_DPI:-110}
      # Local default is 3000, can be overridden in prod via .env
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ./var:/app/var
      # - /tmp:/tmp
      # Mount your local AWS credentials as read-only
      - ~/.aws:/root/.aws:ro
    depends_on:
      - qdrant

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Interpolate from your .env file, fallback to localhost
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api}
    container_name: nexus-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  qdrant_storage:
