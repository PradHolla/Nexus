[project]
name = "scholera-assignment"
version = "0.1.0"
description = "Nexus: RAG quiz generator over course materials (FastAPI, Qdrant, Claude)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi>=0.143.2",
    "fastembed>=0.9.0",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pydantic>=2.14.1",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "boto3>=1.43.114",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
